<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello dosto 😊🙂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Mobile full screen exact height fix */
        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 4px; }
        
        .whatsapp-wallpaper {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
        }
        .msg-actions { display: none; }
        .msg-bubble:hover .msg-actions, .msg-bubble:active .msg-actions { display: flex; }
        
        /* Clean audio player width */
        audio {
            height: 36px;
            width: 220px;
            max-width: 100%;
            border-radius: 20px;
        }
    </style>
</head>
<body id="bodyTheme" class="bg-[#efeae2] flex justify-center items-center">

    <!-- Main Full-Screen Mobile/Desktop App Container -->
    <div id="appContainer" class="w-full max-w-2xl h-full bg-[#efeae2] flex flex-col relative shadow-2xl overflow-hidden">
        
        <!-- WhatsApp Header -->
        <div id="headerTheme" class="bg-[#00a884] text-white px-3 py-2.5 flex items-center justify-between shadow-md z-30 shrink-0">
            <div class="flex items-center space-x-2.5 cursor-pointer overflow-hidden" onclick="editGroupName()">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-xl shrink-0">
                    👥
                </div>
                <div class="truncate">
                    <div class="flex items-center space-x-1">
                        <h1 id="groupTitle" class="font-bold text-base truncate">Hello dosto 😊🙂</h1>
                        <span class="text-xs text-yellow-200">✏️</span>
                    </div>
                    <p id="statusText" class="text-[11px] text-green-100 truncate">कनेक्ट हो रहा है...</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 shrink-0 relative">
                <button onclick="toggleSearchBox()" class="p-2 hover:bg-black/10 rounded-full transition" title="खोजें">🔍</button>
                <button onclick="toggleThreeDotMenu()" class="p-2 hover:bg-black/10 rounded-full transition text-lg font-bold px-2.5" title="मेन्यू">⋮</button>

                <!-- 3-Dot Menu Dropdown -->
                <div id="threeDotDropdown" class="hidden absolute right-0 top-12 bg-white text-gray-800 shadow-2xl rounded-xl py-1.5 w-56 z-50 border border-gray-200 text-sm">
                    <button onclick="showGroupInfoModal(); toggleThreeDotMenu();" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center space-x-2.5"><span>ℹ️</span><span>ऑनलाइन मेंबर्स देखें</span></button>
                    <button onclick="changeMyName(); toggleThreeDotMenu();" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center space-x-2.5"><span>👤</span><span>अपना नाम बदलें</span></button>
                    <button onclick="editGroupName(); toggleThreeDotMenu();" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center space-x-2.5"><span>✏️</span><span>ग्रुप का नाम बदलें</span></button>
                    <button onclick="toggleTheme(); toggleThreeDotMenu();" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center space-x-2.5"><span>🌓</span><span>डार्क / लाइट मोड</span></button>
                    <button onclick="clearChatForMe(); toggleThreeDotMenu();" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center space-x-2.5 text-red-600 border-t"><span>🧹</span><span>मेरी चैट साफ करें</span></button>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="searchBarContainer" class="hidden bg-white px-3 py-2 border-b flex items-center space-x-2 z-20 shrink-0">
            <input type="text" id="searchInput" placeholder="संदेश खोजें..." oninput="searchMessages(this.value)" class="w-full bg-gray-100 text-gray-800 text-xs px-3 py-2 rounded-lg focus:outline-none">
            <button onclick="toggleSearchBox()" class="text-gray-500 font-bold px-2">✖</button>
        </div>

        <!-- Messages Area -->
        <div id="messagesContainer" class="flex-1 p-3 overflow-y-auto space-y-2.5 flex flex-col whatsapp-wallpaper">
            <div class="bg-[#fff3c4] text-gray-800 self-center text-[11px] px-3 py-1 rounded-lg shadow-sm text-center max-w-[92%]">
                🔒 सभी संदेश एंड-टू-एंड सुरक्षित हैं। फोटो या वीडियो पर टच करके फुल स्क्रीन देखें।
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden px-4 py-1 text-[11px] text-[#00a884] font-semibold bg-white/90 shrink-0"></div>

        <!-- Media Transfer Progress -->
        <div id="uploadStatus" class="hidden bg-[#00a884] text-white text-xs px-4 py-1.5 text-center font-medium shrink-0">
            फाइल भेजी जा रही है... <span id="uploadPercent">0%</span> ⏳
        </div>

        <!-- Reply Preview -->
        <div id="replyPreview" class="hidden bg-white border-l-4 border-[#00a884] px-3 py-1.5 flex justify-between items-center text-xs shrink-0 shadow-sm">
            <div class="truncate">
                <span id="replySender" class="font-bold text-[#00a884]"></span>
                <p id="replyText" class="text-gray-600 truncate"></p>
            </div>
            <button onclick="cancelReply()" class="text-gray-400 font-bold ml-2 p-1">✖</button>
        </div>

        <!-- Bottom Input Bar (Textarea for multi-line paragraphs) -->
        <div id="inputBarTheme" class="bg-[#f0f2f5] p-2 flex items-end space-x-1.5 z-20 border-t border-gray-200 shrink-0">
            <label class="cursor-pointer text-gray-600 hover:text-[#00a884] p-2.5 transition text-xl shrink-0" title="फोटो, वीडियो या फाइल">
                📎
                <input type="file" id="mediaInput" accept="*/*" class="hidden" onchange="sendMediaFile(event)">
            </label>

            <button id="micBtn" onclick="toggleAudioRecord()" class="text-gray-600 hover:text-[#00a884] p-2.5 transition text-xl shrink-0" title="वॉइस नोट">
                🎤
            </button>

            <!-- Multi-line Textarea (Enter creates new line, does NOT send) -->
            <textarea id="messageInput" rows="1" placeholder="संदेश लिखें..." oninput="autoResizeTextarea(this); handleTyping();" class="flex-1 bg-white text-gray-800 rounded-2xl px-3.5 py-2.5 text-sm focus:outline-none border border-gray-300 resize-none max-h-28 overflow-y-auto leading-snug"></textarea>
            
            <!-- Explicit Send Button -->
            <button onclick="sendMessage()" class="bg-[#00a884] hover:bg-[#008069] text-white w-11 h-11 rounded-full flex items-center justify-center shadow-md transition shrink-0 text-lg">
                ➤
            </button>
        </div>

        <!-- Name Entry Overlay Popup (Blurred background hiding chat until name is entered) -->
        <div id="nameOverlayModal" class="hidden absolute inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-5 z-50">
            <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center">
                <div class="text-4xl mb-2">👋</div>
                <h2 class="text-xl font-bold text-[#00a884] mb-1">Hello dosto 😊🙂</h2>
                <p class="text-xs text-gray-500 mb-4">ग्रुप चैट देखने और बात करने के लिए अपना नाम लिखें (यह आपके फोन में सेव रहेगा):</p>
                <input type="text" id="userNameInput" placeholder="अपना नाम लिखें..." class="w-full bg-gray-50 border border-gray-300 p-3 rounded-xl text-sm mb-4 focus:outline-none focus:border-[#00a884] text-gray-800">
                <button onclick="saveNameAndJoin()" class="w-full bg-[#00a884] hover:bg-[#008069] text-white font-bold py-3 rounded-xl shadow-lg text-sm">
                    चैट शुरू करें 🚀
                </button>
            </div>
        </div>

        <!-- Full-Screen Media Lightbox Viewer (WhatsApp Style Preview) -->
        <div id="mediaLightbox" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col justify-between p-4">
            <div class="flex justify-between items-center text-white">
                <span id="lightboxTitle" class="text-xs truncate max-w-[70%] text-gray-300">मीडिया प्रीव्यू</span>
                <div class="flex items-center space-x-4">
                    <a id="lightboxDownloadBtn" href="#" download class="bg-white/20 hover:bg-white/30 p-2 rounded-full text-sm" title="डाउनलोड">⬇️</a>
                    <button onclick="closeLightbox()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full text-sm font-bold">✖</button>
                </div>
            </div>
            <div id="lightboxContent" class="flex-1 flex items-center justify-center overflow-hidden my-2"></div>
        </div>

        <!-- Info Modal (Group Members & Read Receipts) -->
        <div id="infoModal" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
            <div class="bg-white text-gray-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h3 id="modalTitle" class="font-bold text-base text-[#00a884]">विवरण</h3>
                    <button onclick="closeInfoModal()" class="text-gray-500 font-bold p-1">✖</button>
                </div>
                <div id="modalBody" class="text-xs space-y-2 max-h-60 overflow-y-auto"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
